name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Una vez por semana contra las fuentes reales: avisa si alguna cambió de forma.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint
        run: uvx ruff check src tests && uvx ruff format --check src tests
      - name: Tests sin red
        run: uv run --python ${{ matrix.python }} --with pytest --with openpyxl --with xlrd --with-editable . pytest -q

  fuentes-reales:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tests contra las fuentes reales
        run: uv run --python 3.13 --with pytest --with openpyxl --with xlrd --with-editable . pytest -q -m red
      - name: Qué fuente se movió
        # continue-on-error: si el catálogo no contesta, el trabajo igual publica el resultado de los
        # tests, que es la información principal. Una fecha del catálogo no es una revisión (medido
        # el 17/10 con las sanciones del DSS): `movido` significa «volver a medir».
        # if: always() porque un rojo en los tests de red no puede llevarse puesto el informe: son
        # datos distintos y el del contrato sirve justamente cuando algo se cayó.
        if: always()
        continue-on-error: true
        run: uv run --python 3.13 --with-editable . python -m uydatos.fuentes estado >> "$GITHUB_STEP_SUMMARY"
      - name: El contrato de forma, contra la línea de base
        # continue-on-error: un informe semanal que rompe el trabajo por una fuente caída deja de ser
        # un informe. El resumen dice cuál; la corrida de tests ya dijo si el paquete está roto.
        if: always()
        continue-on-error: true
        env:
          INFORME: informes/fuentes-${{ github.run_id }}.json
        run: |
          set -o pipefail
          mkdir -p informes
          uv run --python 3.13 --with-editable . python -m uydatos.verificar \
            --salida "$INFORME" --destino "$RUNNER_TEMP/fuentes" \
            --baseline docs/fuentes.json --falla-si-cambio | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrato-de-fuentes-${{ github.run_id }}
          path: informes/*.json
          retention-days: 90
