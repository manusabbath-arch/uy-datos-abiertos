name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Una vez por semana contra las fuentes reales: avisa si alguna cambió de forma.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint
        run: uvx ruff check src tests && uvx ruff format --check src tests
      - name: Tests sin red
        run: uv run --python ${{ matrix.python }} --with pytest --with openpyxl --with xlrd --with-editable . pytest -q

  fuentes-reales:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tests contra las fuentes reales
        run: uv run --python 3.13 --with pytest --with openpyxl --with xlrd --with-editable . pytest -q -m red
      - name: Qué fuente se movió
        # continue-on-error: si el catálogo no contesta, el trabajo igual publica el resultado de los
        # tests, que es la información principal. Una fecha del catálogo no es una revisión (medido
        # el 17/10 con las sanciones del DSS): `movido` significa «volver a medir».
        continue-on-error: true
        run: uv run --python 3.13 --with-editable . python -m uydatos.fuentes estado >> "$GITHUB_STEP_SUMMARY"
