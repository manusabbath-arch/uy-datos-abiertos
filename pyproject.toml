[project]
name = "uydatos"
version = "0.14.0"
description = "Lectores estrictos de datos públicos de Uruguay y la región: BCU, ANCAP, INIA, INUMET, Salto Grande, INDEC, IBGE, IDE.uy, RUT y cédula."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manu Martinez" }]
keywords = ["uruguay", "datos-abiertos", "open-data", "bcu", "ide-uy", "rut", "inumet", "clima"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Opcionales y fuera del paquete base: leer una planilla no tiene por qué engordar a quien lee una
# serie del BCU. El error de `hojas` dice cuál falta y con qué se instala.
hojas = ["openpyxl>=3.1", "xlrd>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uydatos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not red'"
markers = [
    "red: sale a internet contra la fuente real; se corre a mano con `pytest -m red`",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[project.urls]
Repository = "https://github.com/manusabbath-arch/uy-datos-abiertos"
Changelog = "https://github.com/manusabbath-arch/uy-datos-abiertos/blob/main/CHANGELOG.md"
