[project]
name = "uydatos"
version = "0.1.0"
description = "Lectores estrictos de datos públicos de Uruguay y la región: BCU, ANCAP, INIA, Salto Grande, INDEC, IBGE, RUT y cédula."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manu Martinez" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uydatos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not red'"
markers = [
    "red: sale a internet contra la fuente real; se corre a mano con `pytest -m red`",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[project.urls]
Repository = "https://github.com/manusabbath-arch/uy-datos-abiertos"
